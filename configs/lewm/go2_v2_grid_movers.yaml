# The grid LeWM with training-only mover supervision (docs/dynamic/PLAN.md, P4d): go2_v2_grid plus the mover head on
# every frame's encoded state (per grid column: is a walker in view there, and where; labels from
# go2nav.data.mover_labels, never an input). The predictor and its rollouts see no labels. Same seed, data and schedule
# as go2_v2_grid, so the two differ only in the supervision.
name: go2_v2_grid_movers
seed: 2026102601
model: {size: tiny, history: 4, command_dim: 3, inverse_dynamics: true, inverse_spans: [1, 8],
        inverse_span_weights: [1, 3], grid: [3, 4], mover_head: true}
data: {length: 12, mazes_per_batch: 16, windows_per_maze: 8, batch_size: 128}
objective: {rollout_steps: 8, sigreg_weight: 0.08, sigreg_projections: 1024, sigreg_knots: 17, action_blind: false,
            inverse_weight: 100., grid_weight: 1., mover_weight: 1.}
optimiser: {lr: 5.0e-5, weight_decay: 1.0e-3, warmup_steps: 2000, steps: 60000, grad_clip: 1.0}
runtime: {compile: max-autotune-no-cudagraphs, compile_scope: encoder, workers: 10, prefetch: 2, log_every: 100,
          validate_every: 5000, checkpoint_every: 1000, milestone_every: 10000, checkpoint_predictor: true,
          checkpoint_blocks: 8}
