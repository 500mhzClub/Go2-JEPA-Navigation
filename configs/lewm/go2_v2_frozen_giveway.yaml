# The frozen-target grid LeWM with the give-way top-up (docs/dynamic/PLAN.md, P4f): go2_v2_frozen_grid (P4c), trained
# on corpus v2 plus its give-way units (`data.train_kinds`), where the robot backs off from, advances on and holds before
# movers waiting for it. In the first collection it held in 93% of those windows, so P4c's predictor rarely saw a
# waiting mover answer a retreat. Same seed, encoder, model and schedule as P4c, so the two differ only in the data.
name: go2_v2_frozen_giveway
seed: 2026102601
init_encoder: outputs/lewm/go2_v2/lewm.pt
model: {size: tiny, history: 4, command_dim: 3, inverse_dynamics: false, grid: [3, 4], grid_projector: false,
        frozen_encoder: true}
data: {length: 12, mazes_per_batch: 16, windows_per_maze: 8, batch_size: 128,
       train_kinds: [explore, mission, free, giveway]}
objective: {rollout_steps: 8, sigreg_weight: 0., sigreg_projections: 1024, sigreg_knots: 17, action_blind: false,
            inverse_weight: 0., grid_weight: 1.}
optimiser: {lr: 5.0e-5, weight_decay: 1.0e-3, warmup_steps: 2000, steps: 60000, grad_clip: 1.0}
runtime: {compile: max-autotune-no-cudagraphs, compile_scope: encoder, workers: 10, prefetch: 2, log_every: 100,
          validate_every: 5000, checkpoint_every: 1000, milestone_every: 10000, checkpoint_predictor: false}
