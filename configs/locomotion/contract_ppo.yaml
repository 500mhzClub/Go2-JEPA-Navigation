# Go2 locomotion policy: PPO (rsl-rl) on the nine trainable velocity primitives.
# Mirrors cfgs.pkl of the shipped checkpoint (run lewm-go2-contract-20260516T163413Z, model_500.pt), which was trained
# with the upstream Genesis Go2 example environment (go2nav/locomotion/env.py is its port) for 501 iterations, seed 11.

primitives:            # command order [vx_body_mps, vy_body_mps, yaw_rate_radps]; sampled uniformly at each resample
  hold:           [0.0, 0.0, 0.0]
  forward_slow:   [0.20, 0.0, 0.0]
  forward_medium: [0.25, 0.0, 0.0]
  forward_fast:   [0.30, 0.0, 0.0]
  backward:       [-0.20, 0.0, 0.0]
  yaw_left:       [0.0, 0.0, 0.45]
  yaw_right:      [0.0, 0.0, -0.45]
  arc_left:       [0.20, 0.0, 0.45]
  arc_right:      [0.20, 0.0, -0.45]
command_jitter_std: 0.0

env:
  num_actions: 12
  joint_names: [FR_hip_joint, FR_thigh_joint, FR_calf_joint, FL_hip_joint, FL_thigh_joint, FL_calf_joint,
                RR_hip_joint, RR_thigh_joint, RR_calf_joint, RL_hip_joint, RL_thigh_joint, RL_calf_joint]
  default_joint_angles: {FL_hip_joint: 0.0, FR_hip_joint: 0.0, RL_hip_joint: 0.0, RR_hip_joint: 0.0,
                         FL_thigh_joint: 0.8, FR_thigh_joint: 0.8, RL_thigh_joint: 1.0, RR_thigh_joint: 1.0,
                         FL_calf_joint: -1.5, FR_calf_joint: -1.5, RL_calf_joint: -1.5, RR_calf_joint: -1.5}
  kp: 20.0
  kd: 0.5
  termination_if_roll_greater_than: 10   # degrees
  termination_if_pitch_greater_than: 10
  base_init_pos: [0.0, 0.0, 0.42]
  base_init_quat: [1.0, 0.0, 0.0, 0.0]
  episode_length_s: 20.0
  resampling_time_s: 4.0
  action_scale: 0.25
  simulate_action_latency: true
  clip_actions: 100.0

obs:
  obs_scales: {lin_vel: 2.0, ang_vel: 0.25, dof_pos: 1.0, dof_vel: 0.05}

reward:
  tracking_sigma: 0.25
  base_height_target: 0.3
  feet_height_target: 0.075
  reward_scales: {tracking_lin_vel: 1.0, tracking_ang_vel: 0.8, lin_vel_z: -1.0, base_height: -50.0,
                  action_rate: -0.005, similar_to_default: -0.1}

train:
  algorithm: {class_name: PPO, clip_param: 0.2, desired_kl: 0.01, entropy_coef: 0.01, gamma: 0.99, lam: 0.95,
              learning_rate: 0.001, max_grad_norm: 1.0, num_learning_epochs: 5, num_mini_batches: 4,
              schedule: adaptive, use_clipped_value_loss: true, value_loss_coef: 1.0}
  actor: {class_name: MLPModel, hidden_dims: [512, 256, 128], activation: elu,
          distribution_cfg: {class_name: GaussianDistribution, init_std: 1.0, std_type: scalar}}
  critic: {class_name: MLPModel, hidden_dims: [512, 256, 128], activation: elu}
  obs_groups: {actor: [policy], critic: [policy]}
  num_steps_per_env: 24
  save_interval: 100
  logger: tensorboard

run:
  num_envs: 4096
  max_iterations: 501
  seed: 11
