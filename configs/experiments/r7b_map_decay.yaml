name: 'R7b: moving obstacles with seen-free cells cleared from the map'
description: 'R7 rerun with the routing map''s seen-free clearing on (--map-decay on, go2nav.perception.mapping), the minimal
  ghost-trail fix: R4''s episodes (preliminary-test mazes 30-49, recovery off, shipped locomotion policy, six primitives)
  with one and two polite moving obstacles, for C0 (forecast-perfect reference), C1, C5 (span8w, corpus readout) and C7 (H-JEPA
  level 1); plus the static R4 episodes with clearing on for C1, C5 and C7, paired with their R4 records, to check the fix
  costs nothing when nothing moves. Pairs with R7 (r7_moving_obstacles).'
