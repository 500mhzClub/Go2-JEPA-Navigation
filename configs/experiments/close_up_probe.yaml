name: 'Close-up probe: lv2 with mover trails walking up to the cut, validation mazes 10-29'
description: 'docs/dynamic/PLAN.md, P4g. Static missions are never sealed, and a perfect map of walls and walkers is sealed
  as long as the perceived one (118 s against 114 s a mission), so the map is right that a walker cuts the only route. The
  robot then stands and scans, with at least 2 m of clear route in about half of that time. Here it walks up to the cut,
  stopping 1 m from a track. Mover trails on, paired with the trail probe''s lattice cohorts (tp_lat_obst*).'
