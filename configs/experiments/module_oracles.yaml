name: 'Failure analysis: module oracles on the frozen lattice baseline (validation mazes 10-29)'
description: 'The lattice baseline frozen at lv2 with one harness module at a time given the ground truth (go2nav.controllers.truth),
  at one and two obstacles, paired with lv2. The map: full (the true map, moving obstacles in the route grid as now) and static
  (the true map, moving obstacles only in the 1-cm cells the clearance check sees, not in the route grid; the gap between
  the two is what routing around a moving obstacle as if it were a wall costs). The pose: the true pose for visual odometry
  and registration. Obstacle prediction: true futures in the clearance check. Each gain bounds what learning that module can
  give (docs/dynamic/PLAN.md, failure analysis).'
cohorts:
- name: or_map_static_obst1_c1
  arms: &id001
  - C1
  set: validation
  recovery: 'off'
  models: outputs/locomotion/continuous_policy_c1_lattice.yaml
