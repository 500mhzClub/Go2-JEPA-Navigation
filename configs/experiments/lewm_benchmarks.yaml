name: 'LeWM (C5, C6) through the benchmark suite'
description: 'C5 (the LeWorldModel trained end to end from Go2 pixels, read by its decoder) and C6 (the direct head on its
  encoder) on the conditions of R4 (prelim mazes 30-49, recovery off, reserve-exit v2), R5 (uniform friction 0.3 and 0.25)
  and R6 (stage-2 mazes without and with marked strips at 0.3), on exactly their episodes; compare with the recorded
  cohorts rexit2_ref, c3_shipped_v2, dyn1v2_*, s2ref_* and s2eval_cpu. Added cells the earlier experiments never ran:
  C3 at friction 0.25 and C3/C4 on marked strips. lewm_visual_transfer: every learned arm on the brick and parquet
  demonstration surfaces (go2nav.sim.demo_appearance), which no model trained on, mazes 30-39. Models: the LeWM chain
  (go2nav.training.lewm_chain) at outputs/lewm/chain; paths are relative to the repository root. C5 has cohorts of its
  own (the *_c5 ones, last), run only once its gates L3 and L4 pass (docs/lewm/STATUS.md); C6 runs on the chain as it
  stands.'
