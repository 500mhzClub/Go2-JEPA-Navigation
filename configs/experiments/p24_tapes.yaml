name: M5 in Genesis
base: configs/working.yaml
description: 'docs/dynamic/PLAN.md, P24 stage 2: the working setup with the range sensor and the no-slip pass, as P18''s cost_decision.yaml,
  with decision: tapes: P17''s planner under the frozen rule (planning.genesis_tapes; the environment sets the rule) in place
  of the forecaster''s lattice, the walkers by M5 (tapes: objects:...) or constant velocity (ring_velocity). tapes_smoke_*
  are 2c (mazes 10-12); the rest are 2d: still mazes, polite walkers (1, 2, 4) and walkers that do not yield (1, 2), M5 beside
  constant velocity on the four-walker and not-yielding suites. tapes_smoke2_still_m5 is the still smoke again after the fix
  to the final approach (STATUS P24 2c). tapes_smoke3_* are both smokes again with the end of each route handed to P18''s
  cost (planning.genesis_tapes.travelling, approved 15 November).'
