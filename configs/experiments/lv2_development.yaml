name: 'Lattice development round lv2: no lateral, and backing off from inside the footprint, validation mazes 10-29'
description: 'lv1 (yaw to 0.45 rad/s) with two safety fixes, both lattice-only. (1) No lateral axis (25 candidates):
  both cameras look ahead, and every obstacle contact of lv1 (six) and three of lv0 slid sideways into space no camera
  watched. (2) Back-off: the continuous policy creeps about 1 mm/s on a zero command, and every wall contact of lv1
  (six) came after minutes of holding while the base crept from 0.45 m to 0.26-0.32 m of the wall with every
  candidate blocked; inside the footprint, the translation never closer than hold that ends furthest out is taken.
  Paired with lv1 (and dv3).'
