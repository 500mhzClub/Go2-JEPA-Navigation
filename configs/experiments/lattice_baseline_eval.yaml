name: 'Frozen lattice baseline: static parity and the held-out evaluation (P2b, continuous commands)'
description: 'The dv3 harness with C1 scoring the command lattice frozen at round lv2 (forward -0.10 to 0.45 m/s, no lateral,
  yaw to 0.45 rad/s; continuous safety block, dynamic-window fallback, back-off from inside the footprint), C1 refitted on
  the command-range collection, on the continuous-contract policy. The same missions as the frozen six-primitive evaluation
  (frozen_baseline_eval.yaml), C1 only, paired with it: static parity on R4 and the R6 reference, held-out static episode
  1, and prelim_test 30-49 episodes 0 and 1 with one and two obstacles in placement series heldout-v1.'
