name: 'R7d probe: precise forgetting and deadlock escape on a sample of R7c missions'
description: 'A sample of R7c missions before the full R7d: 17 failures (forgetting churn, latched turns blocked by a wall,
  a C0 audit false failure), 5 round trips and 3 static missions, with --map-decay floor (no route left: forget stale cells
  once seen as floor first) and --deadlock-escape on (latch timeout and deadlock escape alone). Pairs with R7c (r7c_map_decay_forget).'
