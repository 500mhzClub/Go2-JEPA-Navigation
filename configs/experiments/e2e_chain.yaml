name: 'End-to-end chain: C3 with the models retrained from regenerated data'
description: 'The last step of the end-to-end check: the collections, the decoder-source missions and T1''s corpus
  regenerated from scratch, the T1-T8 chain retrained on them (go2nav.training.chain, original seeds), then C3 and C4
  on preliminary-test mazes 30-49, recovery off, reserve-exit v2 harness (C4 changes too here: its training frames
  include the re-rendered short-pulse frames). Compare with the shipped and retrained-chain cohorts of
  retrained_chain.yaml and, for C4, with R4''s rexit2_ref. Paths are relative to the repository root.'
