  and with two polite moving obstacles (go2nav.sim.obstacles), for the failure analysis of the static harness before any change
  (docs/dynamic/PLAN.md, P2). C0 is the forecast-perfect reference; C1, C5 (span8w, corpus readout) and C7 (H-JEPA level 1)
  pair with their R4 records.
