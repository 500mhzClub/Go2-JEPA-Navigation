name: 'P5 hybrid: the lattice baseline with LeWM v2 forecasting the robot, validation mazes 10-29'
description: 'P5''s hybrid (docs/dynamic/PLAN.md, after the P4 mover gate failed): lv2''s harness unchanged (tracked movers
  for the movers'' state, the give-way and clearance rules), with the robot''s own motion forecast by LeWM v2 through its
  corpus-v2 heads (go2nav.training.lewm_heads_v2): C5 the rollout read by the decoder, C6 the direct head. 25 lattice candidates,
  static and with one and two moving obstacles. Paired with lv2 (C1''s command model).'
cohorts:
- name: hy_static_c5
