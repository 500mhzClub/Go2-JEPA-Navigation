name: 'Give-way probe: the lattice baseline (lv2) with a back-off rule, validation mazes 10-29'
description: 'docs/dynamic/PLAN.md, P4f. lv2 with the give-way rule (go2nav.planning.planner, give_way: a confirmed track
  standing still within 1.5 m ahead while the selection does not advance makes the robot back off at 0.10 m/s, with the scripted
  backup''s checks, until it is 1.3 m away, moves or is lost), static and with one and two moving obstacles; paired with lv2
  (lv2_*). Then the same with mover trails on, paired with the trail probe''s lattice cohorts (tp_lat_obst*; the trail probe
  and gw_static cover static parity), whose residual is the mover in view on the only path. The give-way ceiling found a still
  mover near and ahead responds to a retreat in 85-97% of the probe''s windows; this asks whether a hand rule turns that into
  round trips before a world model is asked to.'
