name: 'Frozen non-learned baseline: static parity and the held-out evaluation (P2b)'
description: 'The harness frozen after round 3 (dv3: R7c clearing and forgetting, floor-first forgetting, latch timeout and
  deadlock escape, terminal burst, constant-velocity obstacle prediction, footprint clearing), C1 on the continuous-contract
  policy. Static parity on R4 (prelim_test 30-49 ep 0; paired with rexit2_ref and M3 loco_cont_r4_c1) and R6 reference (stage2_sets
  30-49, the records'' episodes; paired with s2ref_cpu and loco_cont_r6_ref_c1). Held-out: prelim_test 30-49 episodes 0 and 1 with one and two
  obstacles in placement series heldout-v1 (never used in development), C1 and the oracle C0; static episode 1 alongside.'
