name: 'dv3 probe: constant-velocity obstacle prediction on a sample of dv2 missions'
description: 'Before the full dv3 round: dv2 rules plus --obstacle-prediction on (constant-velocity tracks of moving obstacles
  in the forecast clearance check), on 24 dv2 missions (time-outs, a pose loss, beacon-not-home, round trips and static missions).
  Paired with dv2.'
cohorts:
- name: dv3p_static_c1
  arms: &id001
  - C1
  set: validation
  recovery: 'off'
  models: outputs/locomotion/continuous_policy.yaml
  map_decay: floor
  deadlock_escape: 'on'
  terminal_burst: 'on'
  obstacle_prediction: 'on'
