# Corpus v2 (docs/dynamic/PLAN.md, P4): configs/hjepa/go2_3level.yaml trained on go2nav.data.lewm_corpus_v2, level 1
# with (forward, lateral, yaw) action blocks (command_dim 3). The rest as go2_3level:
# H-JEPA on the Go2 (docs/hjepa/PLAN.md, TIMESCALES.md): three levels trained jointly, stepping 100 ms, 1.6 s and 12.8 s.
# Level 1 is span8w's LeWM (configs/lewm/go2_idm_span8w.yaml: model, objective and seed), trained from scratch.
# Upper levels: the paper's findings for varied scenes (inverse dynamics and macro-action SIGReg against slow-feature
# collapse, SIGReg 0.16), teacher-forced, trained on mission and explore clips only. Clips are 257 frames (25.7 s).
name: go2_3level_v2
seed: 2026102602
level1:
  model: {size: tiny, history: 4, command_dim: 3, inverse_dynamics: true, inverse_spans: [1, 8],
          inverse_span_weights: [1, 3]}
  objective: {rollout_steps: 8, sigreg_weight: 0.08, inverse_weight: 100.}
upper:
  - {stride: 16, context: 3, sigreg_weight: 0.16, inverse_weight: 50., action_sigreg_weight: 0.005}
  - {stride: 8, context: 2, sigreg_weight: 0.16, inverse_weight: 50., action_sigreg_weight: 0.005}
sigreg: {projections: 1024, knots: 17}
data: {mazes_per_batch: 16, windows_per_maze: 8, clips_per_maze: 8, upper_kinds: [mission, explore]}
optimiser: {lr: 5.0e-5, weight_decay: 1.0e-3, warmup_steps: 2000, steps: 60000, grad_clip: 1.0}
# Runtime (21 October, R9700, batch 128 windows + 128 clips): checkpointing every ViT block fits in 9.9 GB at 0.83 s/step,
# 6 blocks in 24.0 GB at 0.77; 8 blocks, about 19 GB at about 0.78 s/step, keeps the desktop's headroom (the GPU drives it).
runtime: {compile: max-autotune-no-cudagraphs, checkpoint_blocks: 8, memory_fraction: 0.85, workers: 10, prefetch: 2,
          log_every: 100, validate_every: 5000, checkpoint_every: 1000, milestone_every: 10000}
